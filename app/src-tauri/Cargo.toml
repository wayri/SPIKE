[package]
name = "spike-desktop"
version = "0.3.0"
description = "SPIKE Electronic Systems Integrity Workbench"
license = "Apache-2.0"
authors = ["SPIKE contributors"]
edition = "2021"
default-run = "spike-desktop"

[lib]
name = "spike_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
rfd = "0.15"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
