[package]
name = "spike-license-issuer"
version = "0.1.0"
description = "Offline SPIKE entitlement issuance tool; never bundled with the desktop application"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
