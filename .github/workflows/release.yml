name: Build and release SPIKE
on:
  push:
    # Gamma Windows previews are published from verified local artifacts.
    # Do not start the all-platform publication chain for these tags.
    tags: ['v*', '!v*-gamma.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked packages as a GitHub release
        type: boolean
        default: false
      tag:
        description: Release tag (leave empty to use the app version)
        type: string
        default: ''
permissions:
  actions: read
  contents: read
concurrency:
  group: spike-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Architecture and publication checks
        run: |
          python scripts/check_architecture.py
          python -m unittest discover -s tests/python -p test_release_automation.py -v
      - name: Verify workflow publication actor
        if: github.event_name == 'push' || inputs.publish
        run: |
          test "$GITHUB_ACTOR" = wayri
          test "$GITHUB_TRIGGERING_ACTOR" = wayri
      - name: Check version, release target, and publication identity
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: python scripts/release_automation.py check
  windows:
    needs: preflight
    uses: ./.github/workflows/windows-release.yml
  unix:
    needs: preflight
    uses: ./.github/workflows/unix-release.yml
  verify:
    needs: [preflight, windows, unix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: SPIKE-*
          path: dist-release
          merge-multiple: true
      - name: Verify complete package set and checksums
        run: python scripts/release_automation.py verify
  publish:
    needs: [preflight, verify]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: SPIKE-*
          path: dist-release
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: python scripts/release_automation.py publish
