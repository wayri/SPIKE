# SPDX-License-Identifier: Apache-2.0
name: POSIX resource limit diagnostics
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'
      - name: Match release managed Python on macOS
        if: runner.os == 'macOS'
        run: |
          uv python install 3.12
          uv venv --seed --managed-python --python 3.12 .build-venv
          echo "$PWD/.build-venv/bin" >> "$GITHUB_PATH"
      - name: Install diagnostic wheels
        run: python -m pip install --only-binary=:all: numpy scipy shapely
      - name: Probe isolated child limits
        run: python scripts/diagnose_posix_limits.py
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-limits-${{ matrix.os }}
          path: build/qualification/posix-limits.json
          if-no-files-found: error
          retention-days: 14
