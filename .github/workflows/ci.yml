name: Source checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python dependencies
        run: python -m pip install numpy scipy shapely matplotlib mplcursors reportlab nanobind jsonschema==4.25.1 pyarrow==25.0.1
      - name: Validate GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck=""
      - name: Architecture and CLI checks
        run: |
          python scripts/check_architecture.py
          python scripts/release_automation.py check
          python -m unittest discover -s tests/python -p test_worker_cli_entry.py -v
          python -m unittest discover -s tests/python -p test_release_automation.py -v
          python -m unittest discover -s tests/python -p test_errors.py -v
          python -m unittest discover -s tests/python -p test_schema_catalog.py -v
          python -m unittest tests.python.test_prepare_release_resources tests.python.test_script_external_interpreter tests.python.test_installed_python_runtime tests.python.test_windows_installer_script -v
          python -m unittest tests.python.test_pcb_volume_mesh tests.python.test_pcb_volume_compiler tests.python.test_pcb_focus_sizing tests.python.test_internal_meshing_engine tests.python.test_dynamic_tetra_adaptation tests.python.test_mom_far_field tests.python.test_multiboard_circuit tests.python.test_multiboard_thermal tests.python.test_multiboard_em -v
      - name: Frontend build and parser checks
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run test:ui-stability
