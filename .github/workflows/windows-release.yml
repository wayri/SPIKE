name: Windows x64 package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-windows-x64.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Build, install, and verify Windows package
        shell: powershell
        run: ./scripts/build_windows_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SPIKE-windows-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
